[package]
name = "fwdslash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line interface and controller for Forward Slash Windows."

[[bin]]
name = "fwdslash"
path = "src/main.rs"

[dependencies]
fsw-path = { path = "../fsw-path" }
fsw-core = { path = "../fsw-core" }
windows-registry = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The self-update path only. `Services_Store` is StoreContext (the sanctioned
# update query); `Foundation` covers the `TypedEventHandler` the vendored
# InstallControl bindings reference; `Win32_System_Com` is the one
# `CoInitializeEx` the update verbs need and nothing else in this binary does.
# This puts fwdslash.exe on the 0.62 island alongside fswbroker.exe --
# docs/dependencies.md.
windows = { workspace = true, features = [
    "Services_Store",
    "Foundation",
    "Foundation_Collections",
    "ApplicationModel",
    "Win32_System_Com",
] }
# What crates/fsw-cli/src/update/install_control.rs is generated against.
windows-core = { workspace = true }
windows-future = { workspace = true }
windows-collections = { workspace = true }

[build-dependencies]
embed-resource = { workspace = true }

[lints]
workspace = true
