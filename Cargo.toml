[workspace]
resolver = "3"
members = [
    "crates/fsw-path",
    "crates/fsw-core",
    "crates/fsw-cli",
    "crates/fsw-broker",
    "crates/fsw-settings",
]

[workspace.package]
version = "0.0.6"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/faratech/fwdslash"
authors = ["Mike Fara", "Fara Technologies LLC"]

# Pinned once here so a member crate can never drift onto a second windows-rs
# generation by accident. See docs/dependencies.md for the version-island rule:
# `windows` and `windows-sys` were deliberately NOT published at 0.100.0, so the
# broker/CLI island (0.62/0.61) and the settings island (0.100) are separate and
# must never meet inside one binary.
[workspace.dependencies]
windows-registry = "0.6.1"
windows-sys = "0.61.2"
windows = "0.62.2"
# The three crates the `windows` 0.62 umbrella re-exports from, named directly
# because the vendored Store bindings in crates/fsw-cli/src/update/ are
# windows-bindgen output and spell their types as `windows_core::`,
# `windows_future::` and `windows_collections::`. They are part of the 0.62
# island and have to resolve to exactly what `windows` 0.62.2 itself resolves
# to -- a second `windows-core` in one binary is two incompatible COM type
# systems. tools/update-deps.py pins all three; see docs/dependencies.md.
windows-core = "0.62.2"
windows-future = "0.3.2"
windows-collections = "0.3.2"
# Pinned once here; two [build-dependencies] copies drifted as literals before.
# windows-registry is island-pinned at 0.6 -- see docs/dependencies.md and
# tools/update-deps.py's ISLAND_PINNED list.
embed-resource = "3.0.11"

[profile.release]
opt-level = "s"      # rustc docs: "z" often produces LARGER binaries than "s". Measure per binary.
lto = "fat"          # Maximum cross-crate optimization and dead code elimination.
codegen-units = 1    # Enables full LTO optimization across all compilation units.
panic = "abort"      # Drops unwinding tables and landing pads entirely.
strip = "symbols"    # Strips symbol tables; keep .pdb files if debugging is needed.
incremental = false
overflow-checks = false

# Identical to release except opt-level, so `s` vs `z` is a profile switch, not an edit.
[profile.release-z]
inherits = "release"
opt-level = "z"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# panic = "abort" makes any of these in a window proc or COM callback an
# instant process death that skips WM_DESTROY -- a ghost tray icon and, for
# the broker, a dead keyboard hook with no notification. Deny the explicit
# forms; indexing stays a warning (the resolver slices deliberately, under
# test).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[patch.crates-io]
windows-reactor = { path = "crates/windows-reactor" }
