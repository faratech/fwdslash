# Inspects — and optionally cancels — a Partner Center submission through the
# Store submission REST API.
#
# This is the escape hatch for publish-to-store.yml. `msstore publish` deletes
# any existing pending submission before it creates a new one, and that delete
# has been seen to 504 and leave the pending submission wedged; every retry
# then fails the same way. Run this workflow with the submission ID to see what
# Partner Center actually thinks the state is, and with `cancel_submission` to
# clear a stuck pending submission without opening the portal.
#
# Cancellation is guarded: it refuses unless Partner Center itself reports the
# given ID as the active pending submission, so it can never delete the live
# listing.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   STORE_TENANT_ID / STORE_CLIENT_ID / STORE_CLIENT_SECRET, falling back to
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET — the same pair
#   publish-to-store.yml resolves, in the same order. Whichever one is used,
#   its Azure AD app must be associated with the Partner Center account
#   (Account settings > User management > Azure AD applications, Manager
#   role) or every call below 401s with "Identity cannot be authorized" —
#   see docs/store-submission.md §1a. STORE_SELLER_ID is not needed here; the
#   REST API addresses the product by app ID.

name: Check Microsoft Store Submission

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Partner Center app ID (Store ID)'
        default: '9P51CM0MTMK2'
        required: true
      submission_id:
        description: 'Submission ID to inspect'
        required: true
      cancel_submission:
        description: 'Cancel this submission after verifying it is the active pending submission'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Query Partner Center submission status
        env:
          APP_ID: ${{ github.event.inputs.app_id }}
          SUBMISSION_ID: ${{ github.event.inputs.submission_id }}
          CANCEL_SUBMISSION: ${{ github.event.inputs.cancel_submission }}
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET || secrets.AZURE_CLIENT_SECRET }}
          CREDENTIAL_SOURCE: ${{ secrets.STORE_TENANT_ID && 'STORE_*' || 'AZURE_* fallback' }}
        run: |
          set -euo pipefail

          for name in STORE_TENANT_ID STORE_CLIENT_ID STORE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Store credentials (resolved credential source: $CREDENTIAL_SOURCE): $name is empty. See docs/store-submission.md §1a."
              exit 1
            fi
          done
          echo "Resolved credential source: $CREDENTIAL_SOURCE"

          token_response="$(curl -sS -X POST \
            "https://login.microsoftonline.com/${STORE_TENANT_ID}/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=${STORE_CLIENT_ID}" \
            -d "client_secret=${STORE_CLIENT_SECRET}" \
            -d "resource=https://manage.devcenter.microsoft.com")"

          token="$(echo "$token_response" | jq -r '.access_token // empty')"
          if [ -z "$token" ]; then
            echo "::error::Failed to get Partner Center access token"
            echo "$token_response" | jq '{error, error_description}'
            exit 1
          fi
          echo "::add-mask::$token"

          base_url="https://manage.devcenter.microsoft.com/v1.0/my/applications/${APP_ID}"

          echo "Partner Center app ID: ${APP_ID}"
          echo "Submission ID: ${SUBMISSION_ID}"
          echo ""

          app_details="$(curl -sS -X GET "$base_url" \
            -H "Authorization: Bearer $token")"

          echo "Application submission pointers:"
          echo "$app_details" | jq '{
            id,
            primaryName,
            lastPublishedApplicationSubmission: (.lastPublishedApplicationSubmission // null | {id, status, updatedDateTime, submittedDateTime}),
            pendingApplicationSubmission: (.pendingApplicationSubmission // null | {id, status, updatedDateTime, submittedDateTime})
          }'
          echo ""

          submission="$(curl -sS -X GET "$base_url/submissions/${SUBMISSION_ID}" \
            -H "Authorization: Bearer $token")"

          echo "Submission details:"
          echo "$submission" | jq '{
            id,
            status,
            statusDetails,
            targetPublishMode,
            targetPublishDate,
            visibility,
            flightId,
            applicationPackages: [(.applicationPackages // [])[] | {
              fileName,
              fileStatus,
              version,
              architecture,
              languages,
              capabilities,
              minimumDirectXVersion,
              minimumSystemRam
            }]
          }'
          echo ""

          status="$(curl -sS -X GET "$base_url/submissions/${SUBMISSION_ID}/status" \
            -H "Authorization: Bearer $token")"

          echo "Submission status endpoint:"
          echo "$status" | jq '{
            status,
            statusDetails,
            errors,
            warnings,
            certificationReports,
            hasAdvancedListingPermission,
            packageValidationResult
          }'

          if [ "$CANCEL_SUBMISSION" != "true" ]; then
            exit 0
          fi

          pending_id="$(echo "$app_details" | jq -r '.pendingApplicationSubmission.id // empty')"
          if [ "$pending_id" != "$SUBMISSION_ID" ]; then
            echo "::error::Refusing to cancel submission $SUBMISSION_ID because Partner Center reports active pending submission '$pending_id'."
            exit 1
          fi

          submission_status="$(echo "$submission" | jq -r '.status // empty')"
          echo "Cancelling verified pending submission $SUBMISSION_ID (status: $submission_status)..."
          http_status="$(curl -sS -o cancel-response.json -w '%{http_code}' -X DELETE \
            "$base_url/submissions/${SUBMISSION_ID}" \
            -H "Authorization: Bearer $token")"
          if [ "$http_status" != "200" ] && [ "$http_status" != "204" ]; then
            echo "::error::Partner Center cancellation failed with HTTP $http_status."
            jq '{code, message, target, details}' cancel-response.json 2>/dev/null || true
            exit 1
          fi

          for attempt in $(seq 1 30); do
            app_after="$(curl -sS -X GET "$base_url" \
              -H "Authorization: Bearer $token")"
            pending_after="$(echo "$app_after" | jq -r '.pendingApplicationSubmission.id // empty')"
            if [ -z "$pending_after" ]; then
              echo "Submission $SUBMISSION_ID cancelled; Partner Center pending pointer is clear."
              exit 0
            fi
            echo "Cancellation accepted; pending pointer is still $pending_after (check $attempt/30)."
            sleep 10
          done

          echo "::error::Partner Center accepted cancellation but did not clear the pending pointer within five minutes."
          exit 1
