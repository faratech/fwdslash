name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  user-mode:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [x64-debug, arm64-debug, x86-debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test native x64
        if: matrix.preset == 'x64-debug'
        shell: pwsh
        run: ctest --preset x64-debug

  driver-compile:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned x64 driver package
        shell: pwsh
        run: .\tools\Build-Driver.ps1 -Architecture x64 -Configuration Debug
