name: build

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '29 3 * * 1'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell-regressions:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # These fixtures import the adapter but never install it, use no profile,
      # and mock every installer/network/package action. Invoke the Windows
      # PowerShell 5.1 executable explicitly: pwsh has different binding and
      # session-state behavior that would miss the compatibility contract.
      - name: Test PowerShell adapter location wrappers
        shell: powershell
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\test\powershell\ForwardSlashWindows.LocationRegression.ps1
          if ($LASTEXITCODE -ne 0) { throw "location regression fixture failed with $LASTEXITCODE" }
      - name: Test PowerShell adapter location wrappers (PowerShell 7)
        shell: pwsh
        run: |
          & pwsh -NoProfile -File .\test\powershell\ForwardSlashWindows.LocationRegression.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell 7 location regression fixture failed with $LASTEXITCODE" }
      - name: Test installer runtime architecture selection
        shell: powershell
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\test\powershell\Install-fwdslash.RuntimeRegression.ps1
          if ($LASTEXITCODE -ne 0) { throw "runtime regression fixture failed with $LASTEXITCODE" }
      - name: Test release version/ref validation
        shell: powershell
        run: |
          & "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\test\powershell\ReleaseVersionRegression.ps1
          if ($LASTEXITCODE -ne 0) { throw "release-version regression fixture failed with $LASTEXITCODE" }

  driver-compile:
    # Hosted Windows images ship no WDK (stampinf.exe is missing), so this job
    # cannot pass on a hosted runner — build driver packages locally or on a
    # self-hosted runner via workflow_dispatch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build unsigned x64 driver package
        shell: pwsh
        run: .\tools\Build-Driver.ps1 -Architecture x64 -Configuration Debug

  # The Rust tree is the shipping product; this job is what the "CI asserts …"
  # claims in docs/dependencies.md and docs/size-baseline.md refer to.
  #
  # Formatting and both Windows Clippy targets must remain warning-clean.
  rust:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Every version literal outside the workspace manifest is registered in
      # tools/bump_version.py; --check fails the job the moment one drifts.
      # This is the standing half of the guarantee -- release.yml's
      # tag-vs-workspace assertion is the other half, and only fires on a tag.
      # Both run before anything expensive: they need no toolchain.
      - name: Assert every version literal agrees with Cargo.toml
        run: python3 tools/bump_version.py --check

      - name: Test the version bumper
        run: python3 -m unittest tools.test_bump_version

      # The notes file is the only thing Store customers read. 0.1.0 shipped
      # notes naming internal routes, a watchdog and an issue number, and they
      # reached a Store submission before anyone read them.
      - name: Assert the release notes read as customer copy
        run: python3 tools/check_release_notes.py

      - name: Test the release-notes linter
        run: python3 -m unittest tools.test_check_release_notes

      # Models check-store-submission.yml's HTTP/JSON response guard against a
      # loopback server; it never contacts Partner Center.
      - name: Test Store-submission HTTP verifier
        run: |
          command -v python3
          command -v curl
          command -v jq
          python3 tools/test_check_store_submission_http.py

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
          components: rustfmt,clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # The two library crates are host-portable: fsw-path has no dependencies
      # at all and fsw-core is #[cfg(windows)]-gated with non-Windows
      # fallbacks, so both test suites run natively on Linux. The CLI's own
      # tests live in the fwdslash *bin* (there is no lib target) and need a
      # Windows target, so they run in the rust-windows job below.
      - name: Test the portable crates
        run: cargo test -p fsw-path -p fsw-core --locked

      # docs/dependencies.md: fsw-path's [dependencies] and [dev-dependencies]
      # are both intentionally empty, because it is one of the only two crates
      # shared across the windows-core version islands. One line of tree output
      # is the crate itself and nothing else.
      - name: Assert fsw-path has no dependencies
        run: test "$(cargo tree -p fsw-path | wc -l)" -eq 1

      # The version-island rule: two windows-core majors are incompatible
      # COM/WinRT type systems and must never meet inside one binary. The
      # settings app is the binary that could see both.
      - name: Assert one windows-core version in fswsettings
        run: |
          versions=$(cargo tree -p fswsettings --target aarch64-pc-windows-msvc -e normal \
            | grep -o 'windows-core v[0-9.]*' | sort -u)
          echo "$versions"
          test "$(echo "$versions" | wc -l)" -eq 1

      # The CLI joined the 0.62 island for the Store update path: it names
      # windows-core, windows-future and windows-collections directly (the
      # vendored InstallControl bindings are generated against them) alongside
      # the `windows` umbrella that re-exports all three. A drift in any one of
      # them is a second windows-core here, so this is the same gate as above.
      - name: Assert one windows-core version in fwdslash
        run: |
          versions=$(cargo tree -p fwdslash --target aarch64-pc-windows-msvc -e normal \
            | grep -o 'windows-core v[0-9.]*' | sort -u)
          echo "$versions"
          test "$(echo "$versions" | wc -l)" -eq 1

      # `cargo check` links nothing, so the MSVC targets type-check here
      # without a linker or the Windows SDK.
      - name: Clippy x64 (all targets)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings
      - name: Clippy ARM64 (all targets)
        run: cargo clippy --workspace --all-targets --target aarch64-pc-windows-msvc --locked -- -D warnings

  # Everything that needs a real MSVC linker: the CLI's bin tests (which also
  # have to *run*, so they need a Windows host) and the release build the size
  # budget is measured against. Sizes are reported, not gated — see
  # docs/size-baseline.md for the recorded size budget.
  rust-windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: x86_64-pc-windows-msvc
          # rustfmt because windows-bindgen shells out to it to format its
          # output, and does so silently: without it the regeneration below
          # would "succeed" with unformatted bytes and report a false diff.
          components: rustfmt

      # crates/fsw-cli/src/update/install_control.rs is committed windows-bindgen
      # output (docs/dependencies.md, "Adding a dependency", option 3).
      # Regenerate it here and fail on any difference -- but only when this
      # runner carries the exact SDK the file records, since a different
      # Windows.winmd legitimately produces different bindings and diffing
      # against it would be noise rather than a staleness signal.
      - name: Check the vendored InstallControl bindings are current
        run: |
          $version = python tools/regen_install_control.py --print-winmd-version
          if ($version -notmatch '^\d+(\.\d+)+$') { throw "regen_install_control.py did not report an SDK version (got '$version')" }
          $winmd = "C:\Program Files (x86)\Windows Kits\10\UnionMetadata\$version\Windows.winmd"
          if (-not (Test-Path -LiteralPath $winmd)) {
            Write-Warning "Windows SDK $version metadata is not on this runner ($winmd); skipping the bindings regeneration check."
            exit 0
          }
          python tools/regen_install_control.py
          git diff --exit-code -- crates/fsw-cli/src/update/install_control.rs
          if ($LASTEXITCODE -ne 0) { throw 'install_control.rs is stale: run python tools/regen_install_control.py' }

      - name: Run the Windows workspace tests
        env:
          # Keep installer-state probes non-elevated on hosted runners.
          __COMPAT_LAYER: RunAsInvoker
        run: cargo test --workspace --all-targets --target x86_64-pc-windows-msvc --locked

      - name: Release build
        run: cargo build --release --workspace --target x86_64-pc-windows-msvc --locked

      - name: Report binary sizes
        run: |
          Get-ChildItem 'target\x86_64-pc-windows-msvc\release' -Filter '*.exe' |
            Where-Object { $_.Name -in 'fwdslash.exe', 'fswbroker.exe', 'fswsettings.exe' } |
            Select-Object Name, @{ Name = 'KB'; Expression = { [Math]::Round($_.Length / 1KB, 1) } } |
            Format-Table -AutoSize | Out-String | Write-Host
