# Release pipeline: a `v*` tag builds the Rust MSIX (both architectures),
# signs it through Azure Trusted Signing, and publishes a GitHub Release with
# the signed bundle plus per-architecture ZIPs of signed executables.
#
# Triggered by version tags, or manually. A tag push always publishes. A
# `workflow_dispatch` run publishes only when its `dry_run` input is explicitly
# false: with the default (true) everything is built and signed and the results
# are uploaded as workflow artifacts, and no release is created — including when
# the dispatch is aimed at a tag ref, which used to publish regardless.
#
# The tag and the workspace version must agree. The binaries embed
# `workspace.package.version` (through FSW_VERSION, PAYLOAD_VERSION and the
# generated VERSIONINFO) while the tag drives the MSIX Identity version, so a
# mismatch would ship a package whose identity contradicts its contents; the
# assertion below fails the run instead.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET — the
#   windowsforum-codesigning-sp service principal for fara-codesigning.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign only (no GitHub Release)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      # The Trusted Signing certificate subject — the MSIX Identity/Publisher
      # must match it exactly for the package to install.
      TS_PUBLISHER: 'CN=Mike Fara, O=Mike Fara, L=White Plains, S=ny, C=US'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-pc-windows-msvc,x86_64-pc-windows-msvc

      - name: Assert the tag matches the workspace version
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $core = @($metadata.packages | Where-Object { $_.name -eq 'fsw-core' })
          if ($core.Count -ne 1) { throw 'cargo metadata did not report exactly one fsw-core package.' }
          $workspace = $core[0].version
          if ($env:GITHUB_REF_NAME -notlike 'v*') {
              Write-Host "Not a tag ref ('$env:GITHUB_REF_NAME'); workspace version is $workspace."
              exit 0
          }
          $tag = $env:GITHUB_REF_NAME.Substring(1)
          if ($tag -ne $workspace) {
              throw "Tag v$tag does not match workspace.package.version $workspace. " +
                    'Bump the root Cargo.toml (and the version-copy list in CLAUDE.md) or retag.'
          }
          Write-Host "Tag v$tag matches workspace.package.version $workspace."

      - name: Derive version from tag
        id: version
        run: |
          if ($env:GITHUB_REF_NAME -like 'v*') {
              $raw = $env:GITHUB_REF_NAME.Substring(1)
          } else {
              $raw = $env:GITHUB_RUN_NUMBER
              $raw = "0.0.$raw"
          }
          if ($raw -notmatch '^\d+\.\d+\.\d+$') {
              throw "Tag must be vMAJOR.MINOR.PATCH (got '$env:GITHUB_REF_NAME')."
          }
          "version=$raw.0" >> $env:GITHUB_OUTPUT
          "short=$raw" >> $env:GITHUB_OUTPUT

      - name: Build (ARM64)
        run: cargo build --release --target aarch64-pc-windows-msvc --workspace

      - name: Build (x64)
        run: cargo build --release --target x86_64-pc-windows-msvc --workspace

      - name: Restore the Trusted Signing dlib
        run: .\signing\install-dlib.ps1

      - name: Package the MSIX bundle (unsigned through makeappx)
        run: |
          .\tools\Package-Msix.ps1 -BinarySource Rust `
              -Version '${{ steps.version.outputs.version }}' `
              -Publisher "$env:TS_PUBLISHER" `
              -PublisherDisplayName 'Mike Fara'

      - name: Sign the packages
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $packages = @(Get-ChildItem 'out\msix' -Recurse -Include '*.msix', '*.msixbundle' |
              ForEach-Object { $_.FullName })
          if ($packages.Count -eq 0) { throw 'No MSIX artifacts were produced.' }
          .\signing\sign.ps1 -Path $packages `
              -Description 'Forward Slash Windows' `
              -DescriptionUrl 'https://github.com/faratech/fwdslash'

      - name: Build the per-architecture ZIPs (signed executables)
        run: |
          .\tools\Build-ReleaseZips.ps1 -Version '${{ steps.version.outputs.short }}'

      - name: Upload workflow artifacts (always, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: fwdslash-release
          path: |
            out\msix\*.msix
            out\msix\*.msixbundle
            out\package\*.zip

      # A tag push publishes; a manual run publishes only when dry_run was
      # explicitly turned off. `inputs.dry_run` is empty on a push, which is
      # why the event name is tested first.
      - name: Create the GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem 'out\msix' -Include '*.msix', '*.msixbundle' -Recurse |
              ForEach-Object { $_.FullName })
          $assets += @(Get-ChildItem 'out\package' -Filter '*.zip' -Recurse |
              ForEach-Object { $_.FullName })
          gh release create "$env:GITHUB_REF_NAME" @assets `
              --title "Forward Slash Windows ${{ steps.version.outputs.short }}" `
              --generate-notes
