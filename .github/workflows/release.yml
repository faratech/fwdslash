# Release pipeline: a `v*` tag builds the Rust MSIX (both architectures),
# signs it through Azure Trusted Signing, and publishes a GitHub Release with
# the signed bundle plus per-architecture ZIPs of signed executables.
#
# Triggered ONLY by version tags — never by branch pushes. `workflow_dispatch`
# runs the same pipeline as a dry run: everything is built and signed but the
# artifacts are uploaded as workflow artifacts instead of creating a release.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET — the
#   windowsforum-codesigning-sp service principal for fara-codesigning.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign only (no GitHub Release)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      # The Trusted Signing certificate subject — the MSIX Identity/Publisher
      # must match it exactly for the package to install.
      TS_PUBLISHER: 'CN=Mike Fara, O=Mike Fara, L=White Plains, S=ny, C=US'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-pc-windows-msvc,x86_64-pc-windows-msvc

      - name: Derive version from tag
        id: version
        run: |
          if ($env:GITHUB_REF_NAME -like 'v*') {
              $raw = $env:GITHUB_REF_NAME.Substring(1)
          } else {
              $raw = $env:GITHUB_RUN_NUMBER
              $raw = "0.0.$raw"
          }
          if ($raw -notmatch '^\d+\.\d+\.\d+$') {
              throw "Tag must be vMAJOR.MINOR.PATCH (got '$env:GITHUB_REF_NAME')."
          }
          "version=$raw.0" >> $env:GITHUB_OUTPUT
          "short=$raw" >> $env:GITHUB_OUTPUT

      - name: Build (ARM64)
        run: cargo build --release --target aarch64-pc-windows-msvc --workspace

      - name: Build (x64)
        run: cargo build --release --target x86_64-pc-windows-msvc --workspace

      - name: Restore the Trusted Signing dlib
        run: .\signing\install-dlib.ps1

      - name: Package the MSIX bundle (unsigned through makeappx)
        run: |
          .\tools\Package-Msix.ps1 -BinarySource Rust `
              -Version '${{ steps.version.outputs.version }}' `
              -Publisher "$env:TS_PUBLISHER" `
              -PublisherDisplayName 'Mike Fara'

      - name: Sign the packages
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $packages = @(Get-ChildItem 'out\msix' -Recurse -Include '*.msix', '*.msixbundle' |
              ForEach-Object { $_.FullName })
          if ($packages.Count -eq 0) { throw 'No MSIX artifacts were produced.' }
          .\signing\sign.ps1 @packages `
              -Description 'Forward Slash Windows' `
              -DescriptionUrl 'https://github.com/faratech/fwdslash'

      - name: Build the per-architecture ZIPs (signed executables)
        run: |
          .\tools\Build-ReleaseZips.ps1 -Version '${{ steps.version.outputs.short }}'

      - name: Upload workflow artifacts (always, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: fwdslash-release
          path: |
            out\msix\*.msix
            out\msix\*.msixbundle
            out\package\*.zip

      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem 'out\msix' -Include '*.msix', '*.msixbundle' -Recurse |
              ForEach-Object { $_.FullName })
          $assets += @(Get-ChildItem 'out\package' -Filter '*.zip' -Recurse |
              ForEach-Object { $_.FullName })
          gh release create "$env:GITHUB_REF_NAME" @assets `
              --title "Forward Slash Windows ${{ steps.version.outputs.short }}" `
              --generate-notes
